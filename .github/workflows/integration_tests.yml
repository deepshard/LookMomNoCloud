name: Integration tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  integration_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayTargetName: "Ubuntu (no GPU)"
            os: ubuntu-latest
            mlc_install: "pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly mlc-llm-nightly"

          - displayTargetName: "Ubuntu (1x T4)"
            os: ubuntu-x64-1x-T4
            mlc_install: "pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cu122 mlc-llm-nightly-cu122"

          - displayTargetName: "Ubuntu (2x RTX4080)"
            os: ubuntu-x64-2x-RTX4080
            mlc_install: "pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cu122 mlc-llm-nightly-cu122"

          - displayTargetName: "macOS (M1)"
            os: macos-latest
            mlc_install: "pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly mlc-llm-nightly"

          - displayTargetName: "macOS (no GPU)"
            os: macos-13
            mlc_install: "pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly mlc-llm-nightly"

    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: "sqlite+aiosqlite:///${{ github.workspace }}/truffle.test.db"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - run: pip install -r python/requirements.txt
      - run: ${{ matrix.mlc_install }}

      - name: Run database migrations
        run: |
          cd python
          python migrations.py

      - name: Run tests
        run: |
          cd python
          PYTHONPATH="." pytest --maxfail=1 -v tests/integration
