name: Release server executable

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install MLC and TVM
        if: matrix.os == 'macos-latest'
        run: |
          pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly mlc-ai-nightly

      - name: Install rest of the dependencies
        run: |
          pip install -r python/requirements.txt

      - name: Build server executable
        run: |
          cd python
          pyinstaller server.spec --clean --noconfirm --log-level=DEBUG

      - name: Archive server executable
        run: |
          tar -czvf server-${GITHUB_SHA:0:7}-${{ matrix.os }}.tar.gz -C python/dist server

      - name: List files 
        run: ls -l
        working-directory: python/dist

      - name: List files
        run: ls -l

      - name: Upload server executable
        uses: actions/upload-artifact@v4
        with:
          name: server-${GITHUB_SHA:0:7}-${{ matrix.os }}.tar.gz
          path: server-${GITHUB_SHA:0:7}-${{ matrix.os }}.tar.gz
