name: Release server executable

on:
  workflow_dispatch:
  push:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: "sqlite+aiosqlite:///${{ github.workspace }}/truffle.test.db"
    strategy:
      fail-fast: false
      matrix:
        os: [
            macos-latest, 
            # ubuntu-cuda12.1-1xt4-x86_64,
        ]
        include:
          - os: macos-latest
            filename: darwin-metal-arm64.tar.gz
          # - os: ubuntu-cuda12.1-1xt4-x86_64
            # filename: ubuntu-cuda-x86_64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install MLC
        run: |
          pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            pip install --upgrade https://truffle-binaries.s3.amazonaws.com/mlc-wheels/mlc_llm-0.1.dev1404%2Bg437166a4-cp310-cp310-macosx_14_0_arm64.whl
          elif [ "${{ matrix.os }}" == "ubuntu-cuda12.1-1xt4-x86_64" ]; then
            pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cu121 mlc-ai-nightly-cu121
          fi

      - name: Install rest of the dependencies
        run: |
          pip install -r python/requirements.txt

      - name: Build server executable
        run: |
          cd python
          pyinstaller server.spec --clean --noconfirm --log-level=DEBUG

      - name: Disable local cuda for integration tests
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-cuda12.1-1xt4-x86_64" ]; then
            export PATH=$(echo $PATH | sed -e 's/:\/usr\/local\/cuda[^:]*//g')
            export LD_LIBRARY_PATH=$(echo $LD_LIBRARYPATH | sed -e 's/:\/usr\/local\/cuda[^:]*//g')
            if nvcc -V; then
              echo "** CUDA compiler is still accessible, failing the test. **"
              exit 1
            else
              echo "** CUDA compiler not accessible, as expected. **"
            fi
          fi

      - name: Run integration tests
        run: |
          echo "Copying alembic migrations"
          cp -r python/alembic python/dist/server/alembic
          echo ${{ github.sha }} > python/dist/server/version.txt
          cd python/dist/server 
          nohup ./server &
          sleep 5
          curl --retry 5 --retry-connrefused http://localhost:8899
          cd ../../
          PYTHONPATH="." pytest --maxfail=1 -vvvvv tests/integration/test_install.py


      - name: Archive server executable
        run: |
          cd python/dist
          tar -czvhf ${{ matrix.filename }} server

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 cp python/dist/${{ matrix.filename }} s3://truffle-binaries/${{ github.sha }}/

      - name: Upload latest metadata
        run: aws s3 cp python/dist/server/version.txt s3://truffle-binaries/latest.txt

      - name: Cleanup
        if: always()
        run: killall server