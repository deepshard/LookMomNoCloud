name: Integration Tests - macOS

on:
  push:
    branches:
      - running-fixes
  workflow_dispatch:

jobs:
  integration_tests:
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: "sqlite+aiosqlite:///${{ github.workspace }}/truffle.test.db"
    strategy:
      fail-fast: false
      matrix:
        os: [
          macos-latest,
          macos-13-xlarge,
        ]
    steps:
      - name: Get server from S3 and start it
        run: |
          curl -L https://truffle-binaries.s3.amazonaws.com/b58796121ab166957733e9bf42d5592218a27168/darwin-metal-arm64.zip -o server.zip
          unzip server.zip
          chmod 0755 server/server
          cp -r ./server/alembic ./alembic
          ./server/server > server_output.log 2>&1 &
          sleep 5
          curl --retry 5 --retry-connrefused http://localhost:8899

      - name: Run integration tests
        run: |
          tail -f server_output.log &
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"id": "6b99b94e-a4e4-473a-bd31-c0462fcaece9", "url": "https://huggingface.co/openai-community/gpt2"}' \
            http://localhost:8899/model/install

      - name: Cleanup
        run: killall server || true