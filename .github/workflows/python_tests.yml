name: Python tests

on: [pull_request]

jobs:
  python_tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///${{ github.workspace }}/truffle.test.db"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - run: pip install -r python/requirements.txt
      - run: pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly mlc-llm-nightly

      - name: Run database migrations
        run: |
          cd python
          python migrations.py

      - name: Run tests
        run: |
          cd python
          PYTHONPATH="." pytest --maxfail=1 -v tests/
