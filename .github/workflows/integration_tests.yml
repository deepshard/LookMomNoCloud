name: Integration tests

on: 
  pull_request:
  workflow_dispatch:

jobs:
  integration_tests:
    strategy:
      matrix:
        os: [
          ubuntu-latest, # no GPU
          ubuntu-x64-1x-T4, # 1x T4 GPU
          macos-13, # no GPU
          macos-latest, # M1
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: nvidia-smi
        if: runner.os == 'Linux'