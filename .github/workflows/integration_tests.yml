name: Integration tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  integration_tests:
    strategy:
      matrix:
        os: [
            ubuntu-latest, # no GPU
            ubuntu-x64-1x-T4, # 1x T4
            ubuntu-x64-2x-T4, # 2x T4
            ubuntu-x64-2x-RTX4080, # 2x RTX4080
            macos-13, # no GPU
            macos-latest, # M1
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: uname -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - run: pip install -r python/requirements.txt
      - run: pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly mlc-llm-nightly

      - name: Run database migrations
        run: |
          cd python
          python migrations.py

      - name: Run tests
        run: |
          cd python
          PYTHONPATH="." pytest --maxfail=1 -v tests/integration
