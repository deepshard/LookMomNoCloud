name: Release server executable

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-cuda12.1-1xt4-x86_64]
        include:
          - os: macos-latest
            filename: server-macos-arm64.tar.gz
          - os: ubuntu-cuda12.1-1xt4-x86_64
            filename: server-ubuntu-cuda-x86_64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install MLC
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly mlc-ai-nightly
          elif [ "${{ matrix.os }}" == "ubuntu-cuda12.1-1xt4-x86_64" ]; then
            pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cu121 mlc-ai-nightly-cu121
          fi

      - name: Install rest of the dependencies
        run: |
          pip install -r python/requirements.txt

      - name: Build server executable
        run: |
          cd python
          pyinstaller server.spec --clean --noconfirm --log-level=DEBUG

      - name: Archive server executable
        run: |
          tar -czvhf ${{ matrix.filename }} python/dist/server


      - name: Upload server executable to GCP
        uses: google-github-actions/upload-cloud-storage@v0.7.0
        with:
          path: ${{ matrix.filename }}
          destination: truffle-binaries/${{ matrix.filename }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
